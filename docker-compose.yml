services:
  app-dev:
    build:
      context: .
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  app-prod:
    build:
      context: .
      target: prod
    ports:
      - "${PROD_PORT:-8081}:80"

volumes:
  app_node_modules:
